<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запрошення на весілля | Віталій & Юлія</title>
    
    <!-- Підключаємо твій CSS -->
    <link rel="stylesheet" href="main.css">
    
    <!-- Імпортуємо преміальні весільні шрифти -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

    <!-- СЕКЦІЯ 1: ІНТЕРАКТИВНИЙ КОНВЕРТ -->
    <div id="envelope-overlay" class="envelope-overlay">
        <div class="blur-background"></div>
        <div class="envelope-container">
            <p class="envelope-title mt-5">Вам лист від</p>
            <h1 class="envelope-names">
    <span>Михайла</span>
    <span class="envelope-conjunction">та</span>
    <span>Лариси</span>
</h1>
            
            <div class="envelope-wrapper" id="envelope-wrapper">
                <div class="envelope">
                    <!-- Задня частина та внутрішня шовкова підкладка -->
                    <div class="envelope-back"></div>
                    
                    <!-- Картка із запрошенням всередині -->
                    <div class="letter">
                        <div class="letter-content">
                            <p class="letter-main">Запрошення</p>
                            <p class="letter-sub">на весілля</p>
                        </div>
                    </div>
                    
                    <!-- Передні бокові та нижній клапани паперу -->
                    <div class="envelope-front"></div>
                    
                    <!-- Верхній трикутний клапан, що закривається -->
                    <div class="envelope-top"></div>
                    <div class="wax-seal"></div>
                </div>
            </div>
            <p class="envelope-hint">Натисніть на конверт, щоб відкрити</p>
        </div>
    </div>


<!-- СЕКЦІЯ 2: ГОЛОВНИЙ ЕКРАН (HERO) -->
<section class="hero-section">
    <!-- Напис над карткою -->
    <p class="hero-tagline">SAVE <span>the</span> DATE</p>
    
    <!-- Центральна скляна картка з розділеними іменами -->
    <div class="glass-card">
        <h2 class="hero-names">
            <span class="name-1">Михайло</span>
            <span class="ampersand">&</span>
            <span class="name-2">Лариса</span>
        </h2>
    </div>
    
    <!-- Дата під карткою -->
    <p class="hero-date">29.07.2027</p>
    
    <div class="scroll-arrow">▼</div>
</section>





        <!-- СЕКЦІЯ 3: ТЕКСТОВЕ ЗАПРОШЕННЯ -->
        <section class="invitation-section" id="invitation-section">
            <div class="invitation-card">
                
                <!-- Весільна монограма -->
                <div class="wedding-logo anim-fade-scale delay-1">
                    <span>М&Л</span>
                </div>
                
                <!-- Заголовок -->
                <h3 class="invitation-title anim-letter-spacing delay-2">Дорогі гості!</h3>
                
                <!-- Основний блок тексту -->
                <div class="invitation-text-block">
                    <p class="accent-text anim-letter-spacing delay-3">Запрошуємо на наше весілля!</p>
                    <p class="main-text anim-fade-in delay-4">
                        Нам буде дуже приємно, якщо в цей особливий день ви зможете бути поруч з нами та розділити нашу радість.
                    </p>
                </div>
                
                <!-- Лінійна арка -->
                <div class=" anim-fade-scale delay-4">
                                    <!-- Замість старої іконки ставимо фото брами такого ж розміру -->
                <img src="brama.png" alt="Весільна брама" class="wedding-gate-photo anim-fade-scale delay-4">

                </div>
                
            </div>
        </section>



    <script src="main.js"></script>
</body>

</html>
